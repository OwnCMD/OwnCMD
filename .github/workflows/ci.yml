name: Community checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aster_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ASTER_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/aster_test_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock
      - run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['ASTER_TEST_DATABASE_URL'], autocommit=True) as c:
              c.execute('CREATE EXTENSION IF NOT EXISTS vector')
          PY
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: python -m pytest -q tests
      - run: python scripts/verify_frontend.py
